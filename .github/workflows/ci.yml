name: Django CI/CD

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: |
        python -m pip install --upgrade pip
        pip install flake8
    - run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - run: python config/manage.py test
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and Push
      run: |
        IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/myapp
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
        
        docker build -t $IMAGE_NAME:$SHORT_SHA .
        docker push $IMAGE_NAME:$SHORT_SHA
        
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          docker tag $IMAGE_NAME:$SHORT_SHA $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
        fi

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: webfactory/ssh-agent@v8.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Deploy
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
        docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:$SHORT_SHA
        docker stop myapp || true
        docker rm myapp || true
        docker run -d --name myapp -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:$SHORT_SHA
        EOF